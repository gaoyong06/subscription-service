syntax = "proto3";

package subscription.v1;

option go_package = "subscription-service/api/subscription/v1;v1";

import "google/api/annotations.proto";
import "validate/validate.proto";
import "google/protobuf/empty.proto";

service Subscription {
  // 获取所有订阅套餐
  rpc ListPlans (ListPlansRequest) returns (ListPlansReply) {
    option (google.api.http) = {
      get: "/subscription/v1/plans"
    };
  }
  // 获取用户的订阅状态
  rpc GetMySubscription (GetMySubscriptionRequest) returns (GetMySubscriptionReply) {
    option (google.api.http) = {
      get: "/subscription/v1/my/{userId}"
    };
  }
  // 创建订阅订单 (调用 Payment Service)
  rpc CreateSubscriptionOrder (CreateSubscriptionOrderRequest) returns (CreateSubscriptionOrderReply) {
    option (google.api.http) = {
      post: "/subscription/v1/order"
      body: "*"
    };
  }
  // 支付回调处理 (通常由 Payment Service 或 MQ 调用)
  rpc HandlePaymentSuccess (HandlePaymentSuccessRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/subscription/v1/payment/success"
      body: "*"
    };
  }
  // 取消订阅
  rpc CancelSubscription (CancelSubscriptionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/subscription/v1/cancel"
      body: "*"
    };
  }
  // 暂停订阅
  rpc PauseSubscription (PauseSubscriptionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/subscription/v1/pause"
      body: "*"
    };
  }
  // 恢复订阅
  rpc ResumeSubscription (ResumeSubscriptionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/subscription/v1/resume"
      body: "*"
    };
  }
  // 获取订阅历史记录
  rpc GetSubscriptionHistory (GetSubscriptionHistoryRequest) returns (GetSubscriptionHistoryReply) {
    option (google.api.http) = {
      get: "/subscription/v1/history/{userId}"
    };
  }
  // 设置自动续费
  rpc SetAutoRenew (SetAutoRenewRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/subscription/v1/auto-renew"
      body: "*"
    };
  }
  // 获取即将过期的订阅（用于定时任务）
  rpc GetExpiringSubscriptions (GetExpiringSubscriptionsRequest) returns (GetExpiringSubscriptionsReply) {
    option (google.api.http) = {
      get: "/subscription/v1/expiring"
    };
  }
  // 批量更新过期订阅状态（用于定时任务）
  rpc UpdateExpiredSubscriptions (UpdateExpiredSubscriptionsRequest) returns (UpdateExpiredSubscriptionsReply) {
    option (google.api.http) = {
      post: "/subscription/v1/expired/update"
      body: "*"
    };
  }
  // 处理自动续费（用于定时任务）
  rpc ProcessAutoRenewals (ProcessAutoRenewalsRequest) returns (ProcessAutoRenewalsReply) {
    option (google.api.http) = {
      post: "/subscription/v1/auto-renew/process"
      body: "*"
    };
  }
  // 创建订阅套餐
  rpc CreatePlan (CreatePlanRequest) returns (CreatePlanReply) {
    option (google.api.http) = {
      post: "/subscription/v1/plans"
      body: "*"
    };
  }
  // 更新订阅套餐
  rpc UpdatePlan (UpdatePlanRequest) returns (UpdatePlanReply) {
    option (google.api.http) = {
      put: "/subscription/v1/plans/{planId}"
      body: "*"
    };
  }
  // 删除订阅套餐
  rpc DeletePlan (DeletePlanRequest) returns (DeletePlanReply) {
    option (google.api.http) = {
      delete: "/subscription/v1/plans/{planId}"
    };
  }
  
  // 获取套餐的区域定价列表
  rpc ListPlanPricings (ListPlanPricingsRequest) returns (ListPlanPricingsReply) {
    option (google.api.http) = {
      get: "/subscription/v1/plans/{planId}/pricings"
    };
  }
  // 创建区域定价
  rpc CreatePlanPricing (CreatePlanPricingRequest) returns (CreatePlanPricingReply) {
    option (google.api.http) = {
      post: "/subscription/v1/plans/{planId}/pricings"
      body: "*"
    };
  }
  // 更新区域定价
  rpc UpdatePlanPricing (UpdatePlanPricingRequest) returns (UpdatePlanPricingReply) {
    option (google.api.http) = {
      put: "/subscription/v1/pricings/{planPricingId}"
      body: "*"
    };
  }
  // 删除区域定价
  rpc DeletePlanPricing (DeletePlanPricingRequest) returns (DeletePlanPricingReply) {
    option (google.api.http) = {
      delete: "/subscription/v1/pricings/{planPricingId}"
    };
  }
  
  // 获取订阅订单列表（管理员视角，按应用查询）
  rpc ListSubscriptionOrders (ListSubscriptionOrdersRequest) returns (ListSubscriptionOrdersReply) {
    option (google.api.http) = {
      get: "/subscription/v1/orders"
    };
  }
  
  // 获取订阅订单详情
  rpc GetSubscriptionOrder (GetSubscriptionOrderRequest) returns (GetSubscriptionOrderReply) {
    option (google.api.http) = {
      get: "/subscription/v1/orders/{orderId}"
    };
  }
  
  // 获取应用的订阅用户列表（管理员视角）
  rpc ListAppSubscriptions (ListAppSubscriptionsRequest) returns (ListAppSubscriptionsReply) {
    option (google.api.http) = {
      get: "/subscription/v1/app/subscriptions"
    };
  }
  
  // 获取应用的订阅历史记录（管理员视角）
  rpc GetAppSubscriptionHistory (GetAppSubscriptionHistoryRequest) returns (GetAppSubscriptionHistoryReply) {
    option (google.api.http) = {
      get: "/subscription/v1/app/history"
    };
  }
}

message Plan {
  string planId = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  string currency = 5;
  int32 durationDays = 6; // 持续天数
  string type = 7;         // free, pro, enterprise
  string appId = 8;       // 应用ID
}

message ListPlansRequest {
  string appId = 1;  // 应用ID（查询参数，必填）
}

message CreatePlanRequest {
  string name = 1 [(validate.rules).string = {min_len: 1, max_len: 100}];
  string description = 2;
  double price = 3 [(validate.rules).double = {gte: 0}];
  string currency = 4 [(validate.rules).string = {len: 3}];
  int32 durationDays = 5 [(validate.rules).int32 = {gt: 0}];
  string type = 6 [(validate.rules).string = {min_len: 1}];
}

message CreatePlanReply {
  Plan plan = 1;
}

message UpdatePlanRequest {
  string planId = 1 [(validate.rules).string = {min_len: 1}];
  string name = 2;
  string description = 3;
  double price = 4;
  string currency = 5;
  int32 durationDays = 6;
  string type = 7;
}

message UpdatePlanReply {
  Plan plan = 1;
}

message DeletePlanRequest {
  string planId = 1 [(validate.rules).string = {min_len: 1}];
}

message DeletePlanReply {
  string planId = 1; // 被删除的套餐ID
}

message ListPlansReply {
  repeated Plan plans = 1;
}

message GetMySubscriptionRequest {
  string userId = 1 [(validate.rules).string = {min_len: 1, max_len: 36}]; // 用户ID（字符串 UUID）
}

message GetMySubscriptionReply {
  bool isActive = 1;
  string planId = 2;
  int64 startTime = 3;
  int64 endTime = 4;
  string status = 5; // active, expired, paused, cancelled
  bool autoRenew = 6; // 是否自动续费
}

message CreateSubscriptionOrderRequest {
  string userId = 1 [(validate.rules).string = {min_len: 1, max_len: 36}]; // 用户ID（字符串 UUID）
  string planId = 2 [(validate.rules).string = {min_len: 1, max_len: 50}];
  string paymentMethod = 3 [(validate.rules).string = {in: ["alipay", "wechatpay"]}]; // alipay, wechatpay
  string region = 4; // 区域代码 (e.g., "CN", "US", "EU")，可选，默认 "default"
}

message CreateSubscriptionOrderReply {
  string orderId = 1;       // 业务订单号
  string paymentId = 2;     // 支付流水号
  string payUrl = 3;
  string payCode = 4;
  string payParams = 5;
}

message HandlePaymentSuccessRequest {
  string orderId = 1 [(validate.rules).string = {min_len: 1, max_len: 100}];
  string paymentId = 2 [(validate.rules).string = {min_len: 1, max_len: 100}];
  double amount = 3 [(validate.rules).double = {gt: 0}];
}

// 取消订阅
message CancelSubscriptionRequest {
  string userId = 1 [(validate.rules).string = {min_len: 1, max_len: 36}]; // 用户ID（字符串 UUID）
  string reason = 2; // 取消原因（可选）
}

// 暂停订阅
message PauseSubscriptionRequest {
  string userId = 1 [(validate.rules).string = {min_len: 1, max_len: 36}]; // 用户ID（字符串 UUID）
  string reason = 2; // 暂停原因（可选）
}

// 恢复订阅
message ResumeSubscriptionRequest {
  string userId = 1 [(validate.rules).string = {min_len: 1, max_len: 36}]; // 用户ID（字符串 UUID）
}

// 订阅历史记录
message SubscriptionHistoryItem {
  uint64 id = 1;
  string userId = 2; // 用户ID（字符串 UUID）
  string planId = 3;
  string planName = 4;
  int64 startTime = 5;
  int64 endTime = 6;
  string status = 7; // active, expired, paused, cancelled
  string action = 8; // created, renewed, upgraded, paused, resumed, cancelled
  int64 createdAt = 9;
}

message GetSubscriptionHistoryRequest {
  string userId = 1 [(validate.rules).string = {min_len: 1, max_len: 36}]; // 用户ID（字符串 UUID）
  int32 page = 2; // 页码，从1开始
  int32 pageSize = 3; // 每页数量，默认10
}

message GetSubscriptionHistoryReply {
  repeated SubscriptionHistoryItem items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 pageSize = 4;
}

// 自动续费设置
message SetAutoRenewRequest {
  string userId = 1 [(validate.rules).string = {min_len: 1, max_len: 36}]; // 用户ID（字符串 UUID）
  bool autoRenew = 2; // true: 开启自动续费, false: 关闭自动续费
}

// 获取即将过期的订阅
message GetExpiringSubscriptionsRequest {
  int32 daysBeforeExpiry = 1 [(validate.rules).int32 = {gte: 1, lte: 30}]; // 过期前多少天，默认7天
  int32 page = 2; // 页码，从1开始
  int32 pageSize = 3; // 每页数量，默认10
}

message SubscriptionInfo {
  string userId = 1; // 用户ID（字符串 UUID）
  string planId = 2;
  string planName = 3;
  int64 startTime = 4;
  int64 endTime = 5;
  bool autoRenew = 6;
  double amount = 7;
}

message GetExpiringSubscriptionsReply {
  repeated SubscriptionInfo subscriptions = 1;
  int32 total = 2;
  int32 page = 3;
  int32 pageSize = 4;
}

// 批量更新过期订阅
message UpdateExpiredSubscriptionsRequest {
  // 空请求，自动处理所有过期订阅
}

message UpdateExpiredSubscriptionsReply {
  int32 updatedCount = 1;
  repeated string updatedUserIds = 2; // 更新的用户ID列表（字符串 UUID）
}

// 自动续费处理
message ProcessAutoRenewalsRequest {
  int32 daysBeforeExpiry = 1 [(validate.rules).int32 = {gte: 1, lte: 30}]; // 提前多少天续费，默认3天
  bool dryRun = 2; // 是否为测试运行
}

message AutoRenewResult {
  string userId = 1; // 用户ID（字符串 UUID）
  string planId = 2;
  bool success = 3;
  string orderId = 4;
  string paymentId = 5;
  string errorMessage = 6;
}

message ProcessAutoRenewalsReply {
  int32 totalCount = 1;    // 总共需要处理的数量
  int32 successCount = 2;  // 成功的数量
  int32 failedCount = 3;   // 失败的数量
  repeated AutoRenewResult results = 4;
}

// 区域定价相关消息
message PlanPricing {
  uint64 planPricingId = 1;
  string planId = 2;
  string countryCode = 3; // ISO 3166-1 alpha-2 国家代码
  double price = 4;
  string currency = 5;
}

message ListPlanPricingsRequest {
  string planId = 1 [(validate.rules).string = {min_len: 1}];
}

message ListPlanPricingsReply {
  repeated PlanPricing pricings = 1;
}

message CreatePlanPricingRequest {
  string planId = 1 [(validate.rules).string = {min_len: 1}];
  string countryCode = 2 [(validate.rules).string = {len: 2}]; // ISO 3166-1 alpha-2
  double price = 3 [(validate.rules).double = {gt: 0}];
  string currency = 4 [(validate.rules).string = {len: 3}];
}

message CreatePlanPricingReply {
  PlanPricing pricing = 1;
}

message UpdatePlanPricingRequest {
  uint64 planPricingId = 1 [(validate.rules).uint64 = {gt: 0}];
  double price = 2 [(validate.rules).double = {gt: 0}];
  string currency = 3 [(validate.rules).string = {len: 3}];
}

message UpdatePlanPricingReply {
  PlanPricing pricing = 1;
}

message DeletePlanPricingRequest {
  uint64 planPricingId = 1 [(validate.rules).uint64 = {gt: 0}];
}

message DeletePlanPricingReply {
  uint64 planPricingId = 1; // 被删除的区域定价ID
}

// 订阅订单列表查询请求（管理员视角）
message ListSubscriptionOrdersRequest {
  string appId = 1; // 应用ID（查询参数，必填）
  string userId = 2; // 用户ID（查询参数，可选）
  string planId = 3; // 套餐ID（查询参数，可选）
  string status = 4; // 支付状态（查询参数，可选）：pending, success, failed, closed, refunded, partially_refunded
  int32 page = 5; // 页码，从1开始，默认1
  int32 pageSize = 6; // 每页数量，默认10，最大100
}

// 订阅订单信息
message SubscriptionOrderInfo {
  string orderId = 1; // 订单号
  string paymentId = 2; // 支付流水号
  string userId = 3; // 用户ID（字符串 UUID）
  string planId = 4; // 套餐ID
  string planName = 5; // 套餐名称（关联查询）
  string appId = 6; // 应用ID
  double amount = 7; // 金额
  string currency = 8; // 币种（从套餐获取）
  string paymentStatus = 9; // 支付状态：pending, success, failed, closed, refunded, partially_refunded
  int64 createdAt = 10; // 创建时间（timestamp）
}

// 订阅订单列表响应
message ListSubscriptionOrdersReply {
  repeated SubscriptionOrderInfo orders = 1;
  int32 total = 2; // 总数
  int32 page = 3; // 当前页码
  int32 pageSize = 4; // 每页数量
}

// 获取订阅订单详情请求
message GetSubscriptionOrderRequest {
  string orderId = 1 [(validate.rules).string = {min_len: 1, max_len: 100}];
}

// 获取订阅订单详情响应
message GetSubscriptionOrderReply {
  SubscriptionOrderInfo order = 1;
}

// 应用的订阅用户列表请求（管理员视角）
message ListAppSubscriptionsRequest {
  string appId = 1 [(validate.rules).string = {min_len: 1}]; // 应用ID（查询参数，必填）
  string status = 2; // 订阅状态（查询参数，可选）：active, expired, paused, cancelled
  string userId = 3; // 用户ID（查询参数，可选，用于筛选特定用户）
  int32 page = 4; // 页码，从1开始，默认1
  int32 pageSize = 5; // 每页数量，默认10，最大100
}

// 订阅用户信息
message AppSubscriptionInfo {
  uint64 subscriptionId = 1; // 订阅ID
  string userId = 2; // 用户ID（字符串 UUID）
  string planId = 3; // 套餐ID
  string planName = 4; // 套餐名称（关联查询）
  string appId = 5; // 应用ID
  int64 startTime = 6; // 开始时间（timestamp）
  int64 endTime = 7; // 结束时间（timestamp）
  string status = 8; // 订阅状态：active, expired, paused, cancelled
  string orderId = 9; // 订单ID
  bool autoRenew = 10; // 是否自动续费
  int64 createdAt = 11; // 创建时间（timestamp）
  int64 updatedAt = 12; // 更新时间（timestamp）
}

// 应用的订阅用户列表响应
message ListAppSubscriptionsReply {
  repeated AppSubscriptionInfo subscriptions = 1;
  int32 total = 2; // 总数
  int32 page = 3; // 当前页码
  int32 pageSize = 4; // 每页数量
}

// 应用的订阅历史记录请求（管理员视角）
message GetAppSubscriptionHistoryRequest {
  string appId = 1 [(validate.rules).string = {min_len: 1}]; // 应用ID（查询参数，必填）
  string userId = 2; // 用户ID（查询参数，可选，用于筛选特定用户）
  string action = 3; // 操作类型（查询参数，可选）：created, renewed, upgraded, paused, resumed, cancelled, expired, enabled_auto_renew, disabled_auto_renew
  int64 startTime = 4; // 开始时间（查询参数，可选，timestamp）
  int64 endTime = 5; // 结束时间（查询参数，可选，timestamp）
  int32 page = 6; // 页码，从1开始，默认1
  int32 pageSize = 7; // 每页数量，默认10，最大100
}

// 应用的订阅历史记录响应
message GetAppSubscriptionHistoryReply {
  repeated SubscriptionHistoryItem items = 1;
  int32 total = 2; // 总数
  int32 page = 3; // 当前页码
  int32 pageSize = 4; // 每页数量
}
